<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1572FE" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#1572FE" />
    </linearGradient>
  </defs>
  <!-- Stylized graduation cap & nexus ribbon geometry -->
  <!-- Left Side: Stylized 'E' Ribbon -->
  <path d="M 22,35 L 50,18 L 50,48 L 22,65 Z" fill="url(#grad1)" />
  <!-- Right Side: Stylized 'N' Ribbon -->
  <path d="M 78,35 L 50,18 L 50,48 L 78,65 Z" fill="url(#grad2)" />
  <!-- Bottom connection overlapping wings -->
  <path d="M 22,65 L 50,48 L 50,82 L 22,65 Z" fill="url(#grad2)" opacity="0.9" />
  <path d="M 78,65 L 50,48 L 50,82 L 78,65 Z" fill="url(#grad1)" opacity="0.9" />
  <!-- Top Cap Face overlay -->
  <path d="M 50,18 L 78,35 L 50,52 L 22,35 Z" fill="url(#grad1)" />
  <!-- Center separator cut -->
  <path d="M 50,18 L 50,82" stroke="#FAF9F6" stroke-width="2" stroke-linecap="round" />
</svg>
